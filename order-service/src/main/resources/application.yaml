spring:
  application:
    name: ecom-order-service
  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080

logging:
  level:
    com.ecom.order_service.client: debug

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 10
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    lease-renewal-interval-in-seconds: 10

resilience4j:
  ratelimiter:
    instances:
      inventoryServiceRateLimiter:
        limit-for-period: 2
        limit-refresh-period: 10s
        timeout-duration: 0s

  TimeLimiter:
    instances:
      inventoryServiceTimeLimiter:
        timeout-duration: 5s
        cancel-running-future: true

  CircuitBreaker:
    instances:
      inventoryServiceCircuitBreaker:

      #sliding window type can be COUNT_BASED or TIME_BASED
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 1

        #failure threshold in percentage, if the failure rate is equal or greater than this value, the circuit breaker will open
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s


        #half open configuration, when the circuit breaker is in half open state, it will allow a certain number of calls to pass through, if they are successful, the circuit breaker will close
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces