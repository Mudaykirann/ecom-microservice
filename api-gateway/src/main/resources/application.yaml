spring:
  application:
    name: api-gateway
  cloud: 
    gateway:
      server:
        webflux:
          routes:
            - id: ecom-order-service
              uri: lb://ECOM-ORDER-SERVICE
              predicates:
                - Path=/order/**
                
            - id: ecom-inventory-service
              uri: lb://ECOM-INVENTORY-SERVICE
              predicates:
                - Path=/inventory/**

server:
  port: 9090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
